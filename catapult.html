<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Castle Siege</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a0000; color:#ffff00; font-family:'Arial',sans-serif; overflow:hidden; touch-action:none; }
canvas { display:block; margin:0 auto; }
#hud { position:absolute; top:0; left:0; width:100%; pointer-events:none; }
#level-display { position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:18px; color:#ffff00; }
#ammo-display { position:absolute; top:10px; left:10px; font-size:16px; color:#ffff00; }
#ammo-type { position:absolute; top:35px; left:10px; font-size:13px; color:#ff6666; }
#score-display { position:absolute; top:10px; right:10px; font-size:16px; color:#ffff00; }
#home-btn { position:absolute; bottom:10px; left:10px; background:#3a0000; border:2px solid #ff6666; color:#ffff00; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:14px; text-decoration:none; z-index:100; }
#overlay { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(26,0,0,0.93); z-index:50; }
#overlay h1 { font-size:44px; color:#ffff00; text-shadow:0 0 20px #ff6666; margin-bottom:10px; }
#overlay h2 { font-size:26px; color:#ff6666; margin-bottom:15px; }
#overlay p { font-size:15px; color:#ffff00; margin:4px 0; text-align:center; max-width:300px; }
.score-big { font-size:34px; color:#ffff00; margin:8px 0; }
#start-btn { margin-top:20px; background:#3a0000; border:3px solid #ff6666; color:#ffff00; padding:14px 40px; border-radius:8px; cursor:pointer; font-size:22px; transition:all 0.2s; }
#start-btn:hover { background:#ff6666; color:#1a0000; }
#leaderboard { margin-top:10px; width:280px; }
#leaderboard h3 { color:#ff6666; font-size:16px; margin-bottom:5px; }
#lb-list { list-style:none; }
#lb-list li { display:flex; justify-content:space-between; color:#ffff00; font-size:14px; padding:2px 0; border-bottom:1px solid #3a0000; }
#stars-display { font-size:32px; margin:10px 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="ammo-display">Ammo: 5</div>
  <div id="ammo-type">🪨 Rock</div>
  <div id="level-display">Level 1</div>
  <div id="score-display">Score: 0</div>
</div>
<a id="home-btn" href="index.html">🏠 Home</a>
<div id="overlay">
  <h1>🏰 Castle Siege</h1>
  <p>Drag back the catapult to aim!</p>
  <p>Release to fire at the castle!</p>
  <p>🪨 Rock • 💥 Bomb • ⚽ Bouncy Ball</p>
  <div id="score-area" style="display:none">
    <div id="stars-display"></div>
    <div class="score-big" id="final-score"></div>
    <div id="hi-score-display" style="color:#ff6666;font-size:16px"></div>
  </div>
  <button id="start-btn">SIEGE!</button>
  <div id="leaderboard"><h3>🏆 Top Scores</h3><ul id="lb-list"></ul></div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
const FB_CONFIG={apiKey:"AIzaSyCF9IHEEWXxX24ouRVpkZuFR958N6_ceIc",authDomain:"enders-games.firebaseapp.com",databaseURL:"https://enders-games-default-rtdb.firebaseio.com",projectId:"enders-games"};
let fbApp,fbDb;
try{fbApp=firebase.initializeApp(FB_CONFIG,'lb_catapult');fbDb=firebase.database(fbApp);}catch(e){}
function submitScore(s){if(!fbDb)return;const name=localStorage.getItem('visitorName')||'Player';fbDb.ref('leaderboard/catapult').push({name,score:s,ts:Date.now()});}
function loadLeaderboard(){if(!fbDb)return;fbDb.ref('leaderboard/catapult').orderByChild('score').limitToLast(5).on('value',snap=>{const items=[];snap.forEach(c=>items.unshift(c.val()));document.getElementById('lb-list').innerHTML=items.map((e,i)=>`<li><span>${i+1}. ${e.name}</span><span>${e.score}</span></li>`).join('');});}
loadLeaderboard();

let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(freq,dur,type='square',vol=0.12){try{const ctx=getAudio();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);o.start();o.stop(ctx.currentTime+dur);}catch(e){}}
function playLaunch(){playTone(300,0.15,'sawtooth',0.15);setTimeout(()=>playTone(200,0.1,'sawtooth',0.1),150);}
function playBounce(){playTone(500,0.08,'sine',0.1);}
function playHit(){playTone(200,0.2,'square',0.15);}
function playExplode(){playTone(80,0.5,'sawtooth',0.3);setTimeout(()=>playTone(60,0.3,'square',0.2),200);}
function playKnight(){playTone(400,0.1,'square',0.1);setTimeout(()=>playTone(300,0.1,'square',0.1),100);setTimeout(()=>playTone(200,0.2,'sawtooth',0.15),200);}

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=Math.min(window.innerWidth,480);H=canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

let gameState='menu';
let level,score,totalScore;
let projectile,blocks,knights,particles;
let ammoLeft,ammoUsed,ammoType;
let catapult,dragging,dragStart,dragCurrent;
let frame;
const GROUND=()=>H*0.78;

const LEVELS=[
  {ammo:5,types:['rock'],blocks:[{x:0.55,y:0,w:0.06,h:0.12,mat:'stone'},{x:0.65,y:0,w:0.06,h:0.12,mat:'stone'},{x:0.55,y:0.12,w:0.16,h:0.06,mat:'wood'},{x:0.6,y:0.18,w:0.06,h:0.08,mat:'stone'}],knights:[{x:0.6,y:0.26}]},
  {ammo:5,types:['rock'],blocks:[{x:0.5,y:0,w:0.05,h:0.15,mat:'stone'},{x:0.7,y:0,w:0.05,h:0.15,mat:'stone'},{x:0.5,y:0.15,w:0.25,h:0.05,mat:'wood'},{x:0.57,y:0.2,w:0.11,h:0.1,mat:'brick'},{x:0.6,y:0.3,w:0.05,h:0.06,mat:'stone'}],knights:[{x:0.62,y:0.36},{x:0.55,y:0.15}]},
  {ammo:6,types:['rock','bomb'],blocks:[{x:0.45,y:0,w:0.04,h:0.2,mat:'stone'},{x:0.75,y:0,w:0.04,h:0.2,mat:'stone'},{x:0.45,y:0.2,w:0.34,h:0.04,mat:'wood'},{x:0.5,y:0.24,w:0.24,h:0.15,mat:'brick'},{x:0.55,y:0.39,w:0.14,h:0.06,mat:'stone'}],knights:[{x:0.62,y:0.45},{x:0.62,y:0.24}]},
  {ammo:7,types:['rock','bomb'],blocks:[{x:0.48,y:0,w:0.04,h:0.25,mat:'stone'},{x:0.72,y:0,w:0.04,h:0.25,mat:'stone'},{x:0.48,y:0.25,w:0.28,h:0.04,mat:'wood'},{x:0.52,y:0.29,w:0.2,h:0.08,mat:'brick'},{x:0.56,y:0.37,w:0.12,h:0.08,mat:'stone'},{x:0.59,y:0.45,w:0.06,h:0.05,mat:'wood'}],knights:[{x:0.62,y:0.5},{x:0.62,y:0.29},{x:0.58,y:0.29}]},
  {ammo:8,types:['rock','bomb','bouncy'],blocks:[{x:0.44,y:0,w:0.04,h:0.3,mat:'stone'},{x:0.76,y:0,w:0.04,h:0.3,mat:'stone'},{x:0.44,y:0.3,w:0.36,h:0.04,mat:'wood'},{x:0.48,y:0.34,w:0.28,h:0.1,mat:'brick'},{x:0.52,y:0.44,w:0.2,h:0.08,mat:'stone'},{x:0.55,y:0.52,w:0.14,h:0.06,mat:'wood'},{x:0.58,y:0.58,w:0.08,h:0.08,mat:'stone'}],knights:[{x:0.62,y:0.66},{x:0.6,y:0.44},{x:0.6,y:0.34}]},
];

// Repeat levels with variations for 15 total
for(let i=5;i<15;i++){
  const base=LEVELS[i%5];
  LEVELS.push({
    ammo:base.ammo+Math.floor(i/5),
    types:base.types,
    blocks:base.blocks.map(b=>({...b,x:b.x+(Math.random()-0.5)*0.05,mat:['stone','wood','brick'][Math.floor(Math.random()*3)]})),
    knights:base.knights.map(k=>({...k}))
  });
}

function initLevel(){
  frame=0;
  const lvl=LEVELS[Math.min(level-1,LEVELS.length-1)];
  ammoLeft=lvl.ammo;ammoUsed=0;
  ammoType=lvl.types[0]||'rock';
  projectile=null;dragging=false;
  catapult={x:W*0.18,y:GROUND(),armAngle:-0.8};
  particles=[];
  knights=[];
  blocks=[];

  // build blocks from level definition
  lvl.blocks.forEach(b=>{
    blocks.push({
      x:W*b.x,y:GROUND()-H*b.h-H*b.y,
      w:W*b.w,h:H*b.h,
      mat:b.mat,vx:0,vy:0,angle:0,omega:0,alive:true,
      hp:b.mat==='stone'?3:b.mat==='brick'?2:1
    });
  });

  lvl.knights.forEach(k=>{
    knights.push({x:W*k.x,y:GROUND()-H*k.y-20,alive:true,bounce:0,frame:0});
  });

  updateHUD();
}

function updateHUD(){
  document.getElementById('ammo-display').textContent=`Ammo: ${ammoLeft}`;
  const icons={rock:'🪨 Rock',bomb:'💥 Bomb',bouncy:'⚽ Bouncy Ball'};
  document.getElementById('ammo-type').textContent=icons[ammoType]||ammoType;
  document.getElementById('level-display').textContent=`Level ${level}`;
  document.getElementById('score-display').textContent=`Score: ${totalScore+score}`;
}

function initGame(){
  level=1;score=0;totalScore=0;
  initLevel();
}

// Drag input
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(gameState==='menu'){startGame();return;}
  if(gameState!=='playing')return;
  if(projectile&&projectile.flying)return;
  const t=e.touches[0];const rect=canvas.getBoundingClientRect();
  const tx=t.clientX-rect.left,ty=t.clientY-rect.top;
  if(Math.hypot(tx-catapult.x,ty-catapult.y)<60){dragging=true;dragStart={x:tx,y:ty};dragCurrent={x:tx,y:ty};}
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!dragging)return;
  const t=e.touches[0];const rect=canvas.getBoundingClientRect();
  dragCurrent={x:t.clientX-rect.left,y:t.clientY-rect.top};
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  if(dragging){launch();dragging=false;}
},{passive:false});
canvas.addEventListener('mousedown',e=>{
  if(gameState==='menu'){startGame();return;}
  if(gameState!=='playing')return;
  if(projectile&&projectile.flying)return;
  const rect=canvas.getBoundingClientRect();
  const tx=e.clientX-rect.left,ty=e.clientY-rect.top;
  if(Math.hypot(tx-catapult.x,ty-catapult.y)<80){dragging=true;dragStart={x:tx,y:ty};dragCurrent={x:tx,y:ty};}
});
canvas.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const rect=canvas.getBoundingClientRect();
  dragCurrent={x:e.clientX-rect.left,y:e.clientY-rect.top};
});
canvas.addEventListener('mouseup',()=>{if(dragging){launch();dragging=false;}});

function launch(){
  if(ammoLeft<=0)return;
  const dx=dragStart.x-dragCurrent.x;
  const dy=dragStart.y-dragCurrent.y;
  const power=Math.min(Math.hypot(dx,dy)*0.12,18);
  if(power<1)return;
  const angle=Math.atan2(dy,dx);
  ammoLeft--;ammoUsed++;
  playLaunch();
  const lvl=LEVELS[Math.min(level-1,LEVELS.length-1)];
  // cycle ammo type
  if(ammoUsed%Math.ceil(lvl.ammo/lvl.types.length)===0&&lvl.types.length>1){
    const idx=lvl.types.indexOf(ammoType);
    ammoType=lvl.types[(idx+1)%lvl.types.length];
  }
  projectile={x:catapult.x,y:catapult.y-20,vx:Math.cos(angle)*power,vy:Math.sin(angle)*power,type:ammoType,r:ammoType==='bomb'?14:ammoType==='bouncy'?12:10,bounces:0,flying:true,trail:[]};
  catapult.armAngle=1.2;
  updateHUD();
}

const GRAVITY=0.35;
function update(){
  frame++;
  if(catapult.armAngle>-0.8)catapult.armAngle-=0.08;

  if(projectile&&projectile.flying){
    projectile.trail.push({x:projectile.x,y:projectile.y,life:15});
    projectile.x+=projectile.vx;
    projectile.vy+=GRAVITY;
    projectile.y+=projectile.vy;

    // ground bounce
    if(projectile.y>GROUND()-projectile.r){
      if(projectile.type==='bouncy'&&projectile.bounces<4){
        projectile.vy*=-0.7;projectile.vx*=0.9;projectile.y=GROUND()-projectile.r;
        projectile.bounces++;playBounce();
      } else if(projectile.type==='bomb'){
        explodeBomb(projectile.x,projectile.y);
        projectile.flying=false;
      } else {
        projectile.flying=false;
        spawnParticles(projectile.x,projectile.y,'#888',8);
      }
    }
    if(projectile.x>W+50)projectile.flying=false;

    // collide with blocks
    if(projectile.flying){
      blocks.forEach(b=>{
        if(!b.alive)return;
        if(projectile.x+projectile.r>b.x&&projectile.x-projectile.r<b.x+b.w&&projectile.y+projectile.r>b.y&&projectile.y-projectile.r<b.y+b.h){
          playHit();
          if(projectile.type==='bomb'){explodeBomb(projectile.x,projectile.y);projectile.flying=false;return;}
          b.hp--;
          b.vx+=projectile.vx*0.3;b.vy+=projectile.vy*0.3;b.omega+=(Math.random()-0.5)*0.05;
          spawnParticles(projectile.x,projectile.y,'#cc8844',8);
          if(b.hp<=0){b.alive=false;score+=10;spawnParticles(b.x+b.w/2,b.y+b.h/2,'#ff8800',15);}
          projectile.vx*=-0.3;projectile.vy*=-0.4;
        }
      });
      // collide with knights
      knights.forEach(k=>{
        if(!k.alive)return;
        if(Math.hypot(projectile.x-k.x,projectile.y-k.y)<25){
          playKnight();
          k.alive=false;score+=50;
          spawnParticles(k.x,k.y,'#ffff00',15);
          if(projectile.type!=='bouncy')projectile.flying=false;
        }
      });
    }
  }

  // update blocks physics
  blocks.forEach(b=>{
    if(!b.alive)return;
    b.x+=b.vx;b.y+=b.vy;b.angle+=b.omega;
    b.vy+=GRAVITY*0.5;b.vx*=0.95;b.omega*=0.97;
    if(b.y+b.h>GROUND()){b.y=GROUND()-b.h;b.vy*=-0.3;b.vx*=0.8;b.omega*=0.8;}
    if(b.x<0){b.x=0;b.vx*=-0.5;}if(b.x+b.w>W){b.x=W-b.w;b.vx*=-0.5;}
  });

  // update knights
  knights.forEach(k=>{
    if(!k.alive)return;k.frame++;
    // check if block fell on knight
    blocks.forEach(b=>{
      if(!b.alive)return;
      if(Math.abs(b.x+b.w/2-k.x)<30&&Math.abs(b.y+b.h-k.y)<30&&(b.vx>2||b.vy>2)){
        k.alive=false;score+=50;playKnight();spawnParticles(k.x,k.y,'#ffff00',15);
      }
    });
  });

  // update trail
  if(projectile)projectile.trail=projectile.trail.filter(t=>{t.life--;return t.life>0;});

  // particles
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;return p.life>0;});

  // check level complete
  const allKnightsDead=knights.every(k=>!k.alive);
  if(allKnightsDead&&knights.length>0){
    setTimeout(()=>{
      if(gameState!=='playing')return;
      const stars=ammoUsed<=2?3:ammoUsed<=4?2:1;
      totalScore+=score;
      if(level>=15)endGame(true);
      else{level++;score=0;initLevel();showStars(stars);}
    },1000);
    knights=[];
  } else if(ammoLeft===0&&(!projectile||!projectile.flying)&&!allKnightsDead){
    setTimeout(()=>{if(gameState!=='playing')return;initLevel();score=Math.max(0,score-20);},1000);
  }

  updateHUD();
}

function showStars(n){
  const stars='⭐'.repeat(n)+'☆'.repeat(3-n);
  document.getElementById('stars-display').textContent=stars;
}

function explodeBomb(x,y){
  playExplode();
  spawnParticles(x,y,'#ff8800',25);spawnParticles(x,y,'#ffff00',15);
  blocks.forEach(b=>{
    if(!b.alive)return;
    const dist=Math.hypot(x-b.x-b.w/2,y-b.y-b.h/2);
    if(dist<90){
      b.hp--;const ang=Math.atan2(b.y-y,b.x-x);
      b.vx+=Math.cos(ang)*8;b.vy+=Math.sin(ang)*8-5;b.omega+=(Math.random()-0.5)*0.3;
      if(b.hp<=0){b.alive=false;score+=10;spawnParticles(b.x+b.w/2,b.y+b.h/2,'#ff4400',12);}
    }
  });
  knights.forEach(k=>{
    if(!k.alive)return;
    if(Math.hypot(x-k.x,y-k.y)<90){k.alive=false;score+=50;playKnight();spawnParticles(k.x,k.y,'#ffff00',15);}
  });
  if(projectile)projectile.flying=false;
}

function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2;const s=1+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,color,life:25+Math.random()*15,maxLife:40});}
}

const BLOCK_COLORS={stone:'#778899',wood:'#8B6914',brick:'#cc4422'};
function draw(){
  // sky
  const sky=ctx.createLinearGradient(0,0,0,GROUND());
  sky.addColorStop(0,'#0a0020');sky.addColorStop(1,'#1a0000');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GROUND());
  // ground
  ctx.fillStyle='#2d1000';ctx.fillRect(0,GROUND(),W,H-GROUND());
  ctx.strokeStyle='#ff6666';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,GROUND());ctx.lineTo(W,GROUND());ctx.stroke();

  // castle base
  ctx.fillStyle='#330011';
  ctx.fillRect(W*0.43,GROUND()-8,W*0.38,8);

  // blocks
  blocks.forEach(b=>{
    if(!b.alive)return;
    ctx.save();ctx.translate(b.x+b.w/2,b.y+b.h/2);ctx.rotate(b.angle);
    ctx.fillStyle=BLOCK_COLORS[b.mat]||'#888';
    ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(-b.w/2,-b.h/2,b.w,b.h);
    // cracks
    if(b.hp<(b.mat==='stone'?3:b.mat==='brick'?2:1)){
      ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(-b.w/4,-b.h/4);ctx.lineTo(b.w/4,b.h/4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(b.w/4,-b.h/4);ctx.lineTo(-b.w/4,b.h/4);ctx.stroke();
    }
    ctx.restore();
  });

  // knights
  knights.forEach(k=>{
    if(!k.alive)return;
    ctx.save();ctx.translate(k.x,k.y);
    const bob=Math.sin(k.frame*0.1)*2;
    // body armor
    ctx.fillStyle='#888';ctx.fillRect(-10,-20+bob,20,20);
    ctx.strokeStyle='#aaa';ctx.lineWidth=1;ctx.strokeRect(-10,-20+bob,20,20);
    // helmet
    ctx.fillStyle='#999';ctx.beginPath();ctx.arc(0,-26+bob,11,0,Math.PI*2);ctx.fill();ctx.stroke();
    // visor
    ctx.fillStyle='#333';ctx.fillRect(-6,-30+bob,12,6);
    // sword
    ctx.strokeStyle='#ccc';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(12,-15+bob);ctx.lineTo(20,-5+bob);ctx.stroke();
    // legs
    ctx.fillStyle='#666';ctx.fillRect(-8,0+bob,7,12);ctx.fillRect(1,0+bob,7,12);
    ctx.restore();
  });

  // projectile trail
  if(projectile){
    projectile.trail.forEach(t=>{
      ctx.fillStyle=`rgba(255,200,50,${t.life/15})`;
      ctx.beginPath();ctx.arc(t.x,t.y,3,0,Math.PI*2);ctx.fill();
    });
    // projectile
    if(projectile.flying){
      ctx.save();ctx.translate(projectile.x,projectile.y);
      if(projectile.type==='rock'){
        ctx.fillStyle='#888';ctx.beginPath();ctx.arc(0,0,projectile.r,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='#aaa';ctx.lineWidth=1;ctx.stroke();
      } else if(projectile.type==='bomb'){
        ctx.fillStyle='#333';ctx.beginPath();ctx.arc(0,0,projectile.r,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#888';ctx.fillRect(-2,-projectile.r-6,4,8);
        ctx.fillStyle='#ff8800';ctx.shadowBlur=8;ctx.shadowColor='#ff8800';
        ctx.beginPath();ctx.arc(0,-projectile.r-5,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      } else {
        ctx.fillStyle='#ffffff';ctx.shadowBlur=10;ctx.shadowColor='#4488ff';
        ctx.beginPath();ctx.arc(0,0,projectile.r,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(0,100,255,0.4)';ctx.beginPath();ctx.arc(-3,-3,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      }
      ctx.restore();
    }
  }

  // particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });ctx.globalAlpha=1;

  // catapult
  ctx.save();ctx.translate(catapult.x,catapult.y);
  // wheels
  ctx.fillStyle='#5a3000';
  ctx.beginPath();ctx.arc(-20,0,12,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8B6914';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(20,0,12,0,Math.PI*2);ctx.fill();ctx.stroke();
  // axle
  ctx.strokeStyle='#5a3000';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(-20,0);ctx.lineTo(20,0);ctx.stroke();
  // arm
  ctx.save();ctx.rotate(catapult.armAngle);
  ctx.strokeStyle='#8B6914';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-45);ctx.stroke();
  // cup
  ctx.strokeStyle='#5a3000';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,-45,10,Math.PI,Math.PI*2);ctx.stroke();
  // ball in cup
  if(!projectile||!projectile.flying){
    const icn={rock:'🪨',bomb:'💥',bouncy:'⚽'}[ammoType]||'🪨';
    ctx.font='14px Arial';ctx.textAlign='center';ctx.fillText(icn,0,-48);
  }
  ctx.restore();
  ctx.restore();

  // aim line
  if(dragging&&dragStart&&dragCurrent){
    const dx=dragStart.x-dragCurrent.x;const dy=dragStart.y-dragCurrent.y;
    const power=Math.min(Math.hypot(dx,dy)*0.12,18);
    const angle=Math.atan2(dy,dx);
    ctx.setLineDash([5,8]);ctx.strokeStyle='rgba(255,255,0,0.5)';ctx.lineWidth=1.5;
    let ax=catapult.x,ay=catapult.y-20;let avx=Math.cos(angle)*power,avy=Math.sin(angle)*power;
    ctx.beginPath();ctx.moveTo(ax,ay);
    for(let i=0;i<20;i++){ax+=avx;avy+=GRAVITY;ay+=avy;ctx.lineTo(ax,ay);}
    ctx.stroke();ctx.setLineDash([]);
  }
}

let animId;
function gameLoop(){if(gameState==='playing'){update();draw();}requestAnimationFrame(gameLoop);}
function startGame(){initGame();gameState='playing';document.getElementById('overlay').style.display='none';}
function endGame(won){
  gameState='gameover';
  const hi=parseInt(localStorage.getItem('cat_hi')||'0');
  if(totalScore>hi)localStorage.setItem('cat_hi',totalScore);
  submitScore(totalScore);
  document.getElementById('final-score').textContent=`${won?'You Won! ':''}Score: ${totalScore}`;
  document.getElementById('hi-score-display').textContent=`Best: ${Math.max(totalScore,hi)}`;
  document.getElementById('stars-display').textContent=won?'⭐⭐⭐':'⭐';
  document.getElementById('score-area').style.display='block';
  document.getElementById('start-btn').textContent='Play Again!';
  document.getElementById('overlay').style.display='flex';
}
document.getElementById('start-btn').addEventListener('click',startGame);
gameLoop();
</script>
