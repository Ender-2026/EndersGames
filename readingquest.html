let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function beep(freq,dur,type='sine',vol=0.3){try{const a=getAudio();const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);o.start();o.stop(a.currentTime+dur);}catch(e){}}

const passages=[
  {
    tag:'Science',title:'The Water Cycle',
    text:`Water is always moving! The water cycle is how water travels from the Earth to the sky and back again. First, the sun heats water in oceans, lakes, and rivers. This warm water turns into water vapor, a gas that rises into the air — this is called evaporation. High in the sky, water vapor cools and forms tiny droplets that make clouds. This is called condensation. When clouds get heavy with water droplets, the water falls back to Earth as rain or snow. This is called precipitation. The water soaks into the ground or flows into rivers and oceans, and then the cycle begins all over again!`,

      {text:'What does "precipitation" mean in this passage?',choices:['The sun heating water','Water vapor cooling','Water falling as rain or snow','Water turning into gas'],correct:2,explanation:'The passage says "the water falls back to Earth as rain or snow. This is called precipitation." So precipitation = water falling from the sky.'},
      {text:'What happens AFTER condensation?',choices:['Evaporation','Precipitation','The sun heats water','Water soaks into the ground'],correct:1,explanation:'The order is: evaporation → condensation (cloud formation) → precipitation (water falls). So precipitation comes after condensation.'},
      {text:'What is the MAIN IDEA of this passage?',choices:['Rain is important for plants','Clouds form in the sky','The sun is very hot','Water travels in a repeating cycle'],correct:3,explanation:'The passage describes how water moves from Earth to sky and back, over and over — that\'s the main idea: water travels in a cycle!'},
    ]
  },
  {
    tag:'Science / Nature',title:'The Life of a Butterfly',
    text:`A butterfly's life has four amazing stages called metamorphosis. It begins as a tiny egg, often laid on a leaf. The egg hatches into a caterpillar, also called a larva. The caterpillar eats and grows, shedding its skin several times. Next, it wraps itself in a protective case called a chrysalis, or pupa. Inside the chrysalis, something magical happens — the caterpillar's body completely transforms. After one to two weeks, a beautiful butterfly emerges! It pumps fluid into its wings to expand them, waits for them to dry, and then flies away to find flowers. The butterfly will lay eggs, and the cycle begins again.`,
    questions:[

    text:`Amelia Earhart was one of the most daring aviators in history. Born in 1897, she fell in love with flying after taking her first airplane ride at age 23. She worked many jobs to save money for flying lessons and bought her first plane, which she called "Canary" because of its yellow color. In 1928, Amelia became the first woman to fly across the Atlantic Ocean — though she was a passenger, not the pilot. Determined to prove herself, she trained harder. In 1932, she flew solo across the Atlantic, becoming the first woman to do so alone. She broke records and inspired millions of girls to follow their dreams, showing the world that courage has no gender.`,

let gamePassages=[];
let currentPassageIdx=0;
let score=0;
let totalCorrect=0;
let passageScores=[];
let answered=[];

function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}

function initGame(){
  getAudio(); // lazy init on button click
  gamePassages=shuffle(passages).slice(0,3);
  currentPassageIdx=0;score=0;totalCorrect=0;passageScores=[];
  document.getElementById('start-screen').style.display='none';
  document.getElementById('end-screen').style.display='none';
  document.getElementById('top-bar').style.display='flex';
  document.getElementById('passage-progress').style.display='flex';
  document.getElementById('reading-phase').style.display='block';
  updateDots();
  showPassage();
}

function updateDots(){
  for(let i=0;i<3;i++){
    const d=document.getElementById('dot-'+i);
    if(i<currentPassageIdx)d.className='p-dot done';
    else if(i===currentPassageIdx)d.className='p-dot active';
    else d.className='p-dot';
  }
}

function showPassage(){
  answered=new Array(5).fill(false);
  const p=gamePassages[currentPassageIdx];
  document.getElementById('p-num').textContent=currentPassageIdx+1;
  document.getElementById('passage-tag').textContent=p.tag;
  document.getElementById('passage-title').textContent=p.title;
  document.getElementById('passage-box').textContent=p.text;
  document.getElementById('next-passage-btn').style.display='none';
  buildQuestions(p);
  if(timedMode){startTimer();}else{document.getElementById('timer-display').style.display='none';}
  window.scrollTo({top:0,behavior:'smooth'});
}

function startTimer(){
  timerSeconds=180;
  clearInterval(timerInterval);
  const td=document.getElementById('timer-display');
  td.style.display='block';
  td.classList.remove('warning');
  updateTimerDisplay();
  timerInterval=setInterval(()=>{
    timerSeconds--;
    updateTimerDisplay();
    if(timerSeconds<=30)td.classList.add('warning');
    if(timerSeconds<=0){clearInterval(timerInterval);autoFinishPassage();}
  },1000);
}

function updateTimerDisplay(){
  const m=Math.floor(timerSeconds/60);
  const s=timerSeconds%60;
  document.getElementById('timer-val').textContent=m+':'+(s<10?'0':'')+s;
}

function autoFinishPassage(){
  // Auto-mark unanswered as wrong
  const p=gamePassages[currentPassageIdx];
  p.questions.forEach((_,i)=>{
    if(!answered[i]){
      const choices=document.querySelectorAll(`.q-choice[data-qidx="${i}"]`);
      choices.forEach(c=>{if(parseInt(c.dataset.cidx)===p.questions[i].correct)c.classList.add('correct');});
      document.querySelector(`.q-explanation[data-qidx="${i}"]`).classList.add('show');
      answered[i]=true;
    }
  });
  checkAllAnswered();
}

function buildQuestions(p){
  const section=document.getElementById('questions-section');
  section.innerHTML='';
  p.questions.forEach((q,qi)=>{
    const block=document.createElement('div');
    block.className='q-block';
    block.id='q-block-'+qi;
    block.innerHTML=`<div class="q-num">Question ${qi+1} of 5 — ${['Main Idea','Detail','Vocabulary','Inference','Author\'s Purpose'][qi]||'Comprehension'}</div>
    <div class="q-text">${q.text}</div>
    <div class="q-choices" id="choices-${qi}"></div>
    <div class="q-explanation" data-qidx="${qi}">${q.explanation}</div>`;
    const choicesDiv=block.querySelector('#choices-'+qi);
    q.choices.forEach((ch,ci)=>{
      const btn=document.createElement('button');
      btn.className='q-choice';
      btn.textContent=ch;
      btn.dataset.qidx=qi;
      btn.dataset.cidx=ci;
      btn.addEventListener('click',()=>onAnswer(qi,ci,p));
      choicesDiv.appendChild(btn);
    });
    section.appendChild(block);
  });
}

function onAnswer(qi,ci,p){
  if(answered[qi])return;
  answered[qi]=true;
  const isCorrect=(ci===p.questions[qi].correct);
  const block=document.getElementById('q-block-'+qi);
  const choices=block.querySelectorAll('.q-choice');
  choices.forEach(c=>{
    c.disabled=true;
    if(parseInt(c.dataset.cidx)===p.questions[qi].correct)c.classList.add('correct');
    else if(parseInt(c.dataset.cidx)===ci&&!isCorrect)c.classList.add('wrong');
  });
  block.querySelector(`.q-explanation[data-qidx="${qi}"]`).classList.add('show');
  if(isCorrect){
    playCorrect();
    block.classList.add('answered-correct');
    score+=100;totalCorrect++;
  } else {
    playWrong();
    block.classList.add('answered-wrong');
  }
  document.getElementById('score-val').textContent=score;
  document.getElementById('correct-val').textContent=totalCorrect;
  checkAllAnswered();
}

function checkAllAnswered(){
  if(answered.every(Boolean)){
    clearInterval(timerInterval);
    const nb=document.getElementById('next-passage-btn');
    nb.style.display='block';
    nb.textContent=currentPassageIdx<2?'Next Passage →':'See Final Score 🏆';
  }
}

document.getElementById('questions-btn').addEventListener('click',()=>{
  document.getElementById('questions-section').scrollIntoView({behavior:'smooth'});
});

document.getElementById('next-passage-btn').addEventListener('click',()=>{
  passageScores.push(answered.filter(Boolean).length);
  currentPassageIdx++;
  updateDots();
  if(currentPassageIdx>=3){endGame();}else{showPassage();}
});

function endGame(){
  clearInterval(timerInterval);
  document.getElementById('reading-phase').style.display='none';
  document.getElementById('top-bar').style.display='none';
  document.getElementById('passage-progress').style.display='none';
  const pct=Math.round((totalCorrect/15)*100);
  let badge='😊';
  if(pct>=90)badge='📚';else if(pct>=75)badge='⭐';else if(pct>=60)badge='👍';
  document.getElementById('end-badge').textContent=badge;
  document.getElementById('end-score').innerHTML=`Score: <strong style="color:#ffff00">${score}</strong>/1500<br>Correct: <strong style="color:#66ff66">${totalCorrect}</strong>/15 (${pct}%)<br><small style="color:#ff9999">${pct>=90?'Reading Master!':pct>=75?'Great Comprehension!':pct>=60?'Good Reader!':'Keep Reading!'}</small>`;
  const detail=document.getElementById('score-detail');
  detail.innerHTML=passageScores.map((s,i)=>`<div class="score-row"><span>📖 ${gamePassages[i].title}</span><span style="color:${s>=4?'#66ff66':s>=3?'#ffcc66':'#ff6666'}">${s}/5 correct</span></div>`).join('');
  document.getElementById('end-screen').style.display='block';
  const saved=localStorage.getItem(HS_KEY)||0;
  if(score>saved)localStorage.setItem(HS_KEY,score);
  const name=localStorage.getItem('visitorName');
  if(name)document.getElementById('lb-name').value=name;
  loadLeaderboard();
}

function loadLeaderboard(){
  db.ref('leaderboard/readingquest').orderByChild('score').limitToLast(10).once('value',snap=>{
    const entries=[];snap.forEach(c=>entries.push(c.val()));entries.sort((a,b)=>b.score-a.score);
    const list=document.getElementById('lb-list');
    if(!entries.length){list.innerHTML='<p style="color:#ff9999;text-align:center">No scores yet!</p>';return;}
    list.innerHTML='<strong style="color:#ffff00">Top Scores</strong><br>'+entries.map((e,i)=>`<div class="lb-entry"><span>#${i+1} ${e.name}</span><span style="color:#ffff00">${e.score}</span></div>`).join('');
  });
}

document.getElementById('start-btn').addEventListener('click',initGame);
document.getElementById('play-again-btn').addEventListener('click',initGame);
document.getElementById('lb-submit-btn').addEventListener('click',()=>{
  const name=document.getElementById('lb-name').value.trim()||'Player';
  localStorage.setItem('visitorName',name);
  db.ref('leaderboard/readingquest/'+Date.now()).set({name,score,date:new Date().toLocaleDateString()});
  document.getElementById('lb-submit-btn').textContent='Submitted! ✅';
  document.getElementById('lb-submit-btn').disabled=true;
  setTimeout(loadLeaderboard,800);
});
</script>
</body>
</html>
